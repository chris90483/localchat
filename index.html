<!DOCTYPE html>
<html>
<head>
<style>
html {
	background-color: #333;
	color: lightgrey;
}

input, select, textarea {
	background: black;
	border: 1px solid black;
	border-radius: 10px;
	color: lightgray;
	padding: 0.5rem;
	min-width: 20rem;
}

.flex-col {
	display: flex;
	flex-direction: column;
	max-width: 99vw;
}

.flex-row {
	word-wrap: anywhere;
	margin-top: 4px;
	margin-bottom: 4px;
}

.user-prompt-div {
	color: green;
}

.think-div {
	color: gray;
}

.code-block {
	font-family: monospace;
}

.code-language-header {
	color: darkblue;
}

#error-box {
	color: darkred;
	border: 1px solid gray;
}

#title-row {
	display: flex;
	justify-content: center;
}

</style>
<script>
let g_messageHistory = [];
let g_settings = {};
const g_defaultSettings = {
	apiBaseUrl: "http://localhost:11434",
	model: null
};

function getCookie(cname) {
		let name = cname + "=";
		let decodedCookie = decodeURIComponent(document.cookie);
		let ca = decodedCookie.split(';');
		for(let i = 0; i <ca.length; i++) {
				let c = ca[i];
				while (c.charAt(0) === ' ') {
						c = c.substring(1);
				}
				if (c.indexOf(name) === 0) {
						return c.substring(name.length, c.length);
				}
		}
		return "";
}

function setCookie(cname, cvalue, exdays) {
		const d = new Date();
		d.setTime(d.getTime() + (exdays*24*60*60*1000));
		let expires = "expires="+ d.toUTCString();
		document.cookie = cname + "=" + cvalue + ";" + expires + ";path=/";
}

function onSettingChanged(settingsPropName, newValue) {
	console.log('setting changed:', settingsPropName, newValue);
	document.querySelector('#error-box').innerText = '';
	g_settings[settingsPropName] = newValue;
	switch (settingsPropName) {
		case 'apiBaseUrl': fetchModels(); break;
	}
	
	// if we're here then the new setting is valid and we can persist.
	setCookie('settings', JSON.stringify(g_settings), 365);
}

async function apiSend(method, path, body = null, parseJson = true) {
	while (path.length > 0 && path.startsWith('/')) {
		path = path.slice(1);
	}
	let fetchOptions = { method };
	if (body) {
		fetchOptions.headers = {'Content-Type': 'application/json'};
		fetchOptions.body = JSON.stringify(body);
	}
	
	try {
		const res = await fetch(`${g_settings.apiBaseUrl}/${path}`, fetchOptions);
		if (!res.ok) {
			throw new Error(`HTTP ${res.status}: ${text}`);
		}
		
		if (parseJson) {
			return await res.json();
		}
		
		return res;
	} catch (e) {
		const errorMessage = e.message || JSON.stringify(e, null, 2);
		document.querySelector("#error-box").innerText = `Error while trying to ${method} ${path}: ${JSON.stringify(errorMessage)}`;
	}
}

async function fetchModels() {
	const models = await apiSend('GET', 'api/tags');
	const modelSelectElem = document.querySelector("#model-select");
	for (const model of models.models) {
		const option = document.createElement('option');
		option.value = model.model;
		option.innerText = model.model;
		modelSelectElem.appendChild(option);
	}

	if (g_settings.model) {
		modelSelectElem.value = g_settings.model;
	}
}

function parseResponseChunk(rawChunk) {
	try {
		// usually one chunk is one nicely parseable json message.
		return [JSON.parse(rawChunk)];
	} catch (e) {
		// likely multiple serialized jsons that ended up in the same chunk.
		// parsing the chunk manually to extract the jsons.
		let jsons = [];
		
		let inStringContext = false;
		let escapeNext = false;
		let curlyDepth = 0;
		let chars = [...rawChunk];
		let iStartNextJson = 0;
		
		for (let i = 0; i < chars.length; i++) {
			const char = chars[i];
			if (escapeNext) {
				escapeNext = false;
				continue;
			}
			switch (char) {
				case '\\':
					escapeNext = true;
					continue;
				case '"':
					inStringContext = !inStringContext;
					continue;
				case '{':
					if (!inStringContext) {
						if (curlyDepth === 0) {
							iStartNextJson = i;
						}
						curlyDepth++;
					}
					continue;
				case '}':
					if (!inStringContext) {
						curlyDepth--;	
					}
					if (curlyDepth === 0) {
						// found a json!
						const jsonStr = rawChunk.substring(iStartNextJson, i + 1);
						// if parse still fails here we give up.
						jsons.push(JSON.parse(jsonStr));
					}
					continue;
				default:
					continue;
			}
		}
		
		return jsons;
	}
}

function setupOutputHtml() {
	const chat = document.querySelector('#chat-output');
	const thinkDiv = document.createElement('div');
	thinkDiv.classList.add('think-div');

	const thinkDivSpanTxt1 = document.createElement('span');
	thinkDivSpanTxt1.innerText = 'Thinking... ';
	thinkDiv.appendChild(thinkDivSpanTxt1);

	const thinkDivSpanTxt2 = document.createElement('span');
	thinkDivSpanTxt2.innerText = ' (';
	thinkDiv.appendChild(thinkDivSpanTxt2);
	
	const thinkDivSpanTokenCnt = document.createElement('span');
	thinkDiv.appendChild(thinkDivSpanTokenCnt);
	
	const thinkDivSpanTxt3 = document.createElement('span');
	thinkDivSpanTxt3.innerText = ' tokens)';
	thinkDiv.appendChild(thinkDivSpanTxt3);
	chat.appendChild(thinkDiv);

	const thinkDivContentDiv = document.createElement('div');
	thinkDivContentDiv.classList.add('think-div-content');
	thinkDiv.appendChild(thinkDivContentDiv);
	
	const mdAnswerDiv = document.createElement('div');
	chat.appendChild(mdAnswerDiv);

	return {
		thinkContent: thinkDivContentDiv,
		thinkCountSpan: thinkDivSpanTokenCnt,
		mdAnswerDiv,
	};
}

function extractMd(unparsedTxt) {
	let startTxt = '';
	const chars = [...unparsedTxt];
	const results = [];
	let unparsedStartIndex = 0;

	for (let i = 0; i < chars.length; i++) {
		const char = chars[i];
		switch (char) {
			case '#': {
				let headerLevel = 0;
				let j = i;
				while (chars[j] === '#') {
					headerLevel++;
					j++;
				}

		        if (headerLevel > 6) continue;

				var headerElement = document.createElement(`h${headerLevel}`);
				const hTextStart = j;
				while (j < chars.length && chars[j] !== '\n') {
					j++;
				}
				if (j >= chars.length) {
					// No newline yet: leave this heading in the unparsed tail.
					break;
				}

				
				// SUCCESS
				if (i > unparsedStartIndex) {
					// there's also some text stuff inbetween
					const span = document.createElement('span');
					span.innerText = unparsedTxt.substring(unparsedStartIndex, i);
					results.push({element: span, parseContents: false});
				}

				headerElement.innerText = unparsedTxt.substring(hTextStart, j);
				results.push({element: headerElement, parseContents: true});

				i = j + 1; // + 1 to skip the newline
				unparsedStartIndex = i;
				continue;
			}
			case '`': {
				if (chars[i + 1] == '`' && chars[i + 2] == '`') {

				}
				let j = i + 3;
				let language = '';
				while (j < chars.length && chars[j] !== '\n') {
					if (j >= chars.length) {
						// parse fail, leave in unparsed tail.
						break;
					}

					language += chars[j];
					j++;
				}
				if (language.length) {
					const div = document.createElement('div');
					div.classList.add('code-language-header');
					div.innerText = language;
				}
				j++ // skip \n
				const iCodeStart = j;

				while (j < chars.length && (chars[j] !== '`' || chars[j + 1] !== '`' || chars[j + 2] !== '`')) {
					if (j >= chars.length) {
						// parse fail, leave in unparsed tail.
						break;
					}

					j++;
				}



				i = j + 3; // skip the backticks
				unparsedStartIndex = i;
				continue;
			}
		}
	}

	// parse MD inside of the found elements
	/*
	for (const {element, parseContents} of results) {
		if (!parseContents) continue;
		if (!element.textContent) continue;
		
		const result = extractMd(element.textContent);
		for (const subelement of result.elements) {
			element.appendChild(subelement);
		}
		if (result.unparsedTxt) {
			const span = document.createElement('span');
			span.innerText = result.unparsedTxt;
			element.appendChild(span);
		}
	}
	*/

	return {
		elements: results.map(r => r.element),
		unparsedTxt: unparsedTxt.substring(unparsedStartIndex, unparsedTxt.length)
	};
}

function parseMarkdown(mdAnswerDiv, outputBacklog) {
	let unparsedTail = mdAnswerDiv.querySelector('.unparsed-tail');
	if (!unparsedTail) {
		unparsedTail = document.createElement('span');
		unparsedTail.classList.add('unparsed-tail');
		mdAnswerDiv.appendChild(unparsedTail);
	}
	let unparsedTxt = unparsedTail.textContent + outputBacklog;
	let mdElement = null;
	
	let result = extractMd(unparsedTxt);
	for (const mdElement of result.elements) {
		mdAnswerDiv.insertBefore(mdElement, unparsedTail);
	}
	unparsedTxt = result.unparsedTxt;
	unparsedTail.textContent = unparsedTxt;
}

async function readResponseStream(reader) {
	const decoder = new TextDecoder();

	let {thinkContent, thinkCountSpan, mdAnswerDiv } = setupOutputHtml();
	let outputBacklog = '';
	let rawResponse=  '';
	let lastMdParseIterationMs = 0;
	let parserState = {
		isBusy: false,
		highestParsedMdIndex: 0
	};

	let isThinking = true;
	let thinkTokenCount = 0;
	
	while (true) {
		const { done, value } = await reader.read();
		if (done) {
			// parseMarkdown(mdAnswerDiv, outputBacklog);
			outputBacklog = '';
			break;
		};

		const chunkRaw = decoder.decode(value, { stream: true });
		console.log('raw chunk', chunkRaw);
		try {
			const streamMessages = parseResponseChunk(chunkRaw);
			
			for (const { message } of streamMessages) {
				if (message.thinking) {
					thinkTokenCount++;
					thinkCountSpan.innerText = thinkTokenCount;
					if (message.thinking.includes('.')) {
						thinkContent.innerText = '';
					} else {
						thinkContent.innerText += message.thinking.replaceAll('\n', '');
					}
				} else if (message.content) {
					if (isThinking) {
						isThinking = false;
						thinkContent.innerText = '';
					}

					rawResponse += message.content;
					mdAnswerDiv.innerText += message.content;
					/*
					outputBacklog += message.response;
					
					if (Date.now() - lastMdParseIterationMs > 1000) {
						parseMarkdown(mdAnswerDiv, outputBacklog);
						outputBacklog = '';
					}
					*/
				}
			}
		} catch (e) {
			const errorMessage = e.message || JSON.stringify(e, null, 2);
			document.querySelector('#error-box').innerText = `unparseable chunk: ${chunkRaw} error: ${JSON.stringify(errorMessage)}`;
			if (isThinking) {
				thinkDiv.innerText += ' ';
			} else {
				rawAnswer += ' ';
			}
			continue;
		}
	}

	g_messageHistory.push({
		role: 'assistant',
		content: rawResponse
	});
}

async function sendPrompt(promptTxt) {
	g_messageHistory.push({
		role: 'user',
		content: promptTxt
	});

	const payload = {
		messages: g_messageHistory,
		model: g_settings.model,
		prompt: promptTxt,
		think: true,
		stream: true
	};
	const response = await apiSend('POST', 'api/chat', payload, false);
	
	if (!response.body) {
		throw new Error('No stream received');
	}

	const reader = response.body.getReader();
	await readResponseStream(reader);
}

async function onChatInputKeyDown(event) {
	if (event.shiftKey) return;
	if (event.key !== 'Enter') return;
	
	event.preventDefault();

	const prompt = `${document.querySelector('#chat-input').value}`;
	document.querySelector('#chat-input').value = '';
	const userPromptDiv = document.createElement('div');
	userPromptDiv.innerText = `\n>${prompt}\n`;
	userPromptDiv.classList.add('user-prompt-div');
	
	document.querySelector('#chat-output').appendChild(userPromptDiv);
	await sendPrompt(prompt);
}

function onDomContentLoaded() {
	const settingsCookieTxt = getCookie('settings') ?? g_defaultSettings;
	let settingsCookieParsed = {};
	try {
		settingsCookieParsed = JSON.parse(settingsCookieTxt);
	} catch {};
	g_settings = {
		...g_defaultSettings,
		...settingsCookieParsed
	};
		
	document.querySelector("#api-base-url").value = g_settings.apiBaseUrl;
	
	if (g_settings.apiBaseUrl) {
		fetchModels();
	}
}

document.addEventListener('DOMContentLoaded', onDomContentLoaded);
</script>
</head>
<body>
<div class="flex-col">
	<div id="title-row" class="flex-row">
		<h1>Local chat!</h1>
	</div>
	<div class="flex-row">
		<label for="api-base-url">API base URL: </label>
		<input type="text" id="api-base-url" name="api-base-url" oninput="onSettingChanged('apiBaseUrl', this.value)">
		<br>
	</div>
	<div class="flex-row">
		<label for="model-select">Model: </label>
		<select name="model-select" id="model-select" onchange="onSettingChanged('model', this.value)">
		</select>
	</div>
	<div class="flex-row">
		<div id="error-box"></div>
	</div>
	<div class="flex-row">
		<div id="chat-output"></div>
	</div>
	<div class="flex-row">
		<textarea id="chat-input" onkeydown="onChatInputKeyDown(event)"></textarea>
	</div>
</div>
<body>
</html>
